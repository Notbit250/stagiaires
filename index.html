<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الطالب DZ | Étudiant DZ</title>

<style>
:root{
  --blue:#2563eb;
  --blue-light:#eff6ff;
  --bg:#ffffff;
  --soft:#f7f8fa;
  --text:#252525;
  --muted:#6b7280;
  --border:#e5e7eb;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.9;
}
header{
  border-bottom:1px solid var(--border);
  padding:15px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.logo{font-size:21px;font-weight:bold;color:var(--blue)}
button,input{font:inherit}
button{
  cursor:pointer;
  border:1px solid var(--border);
  background:white;
  color:var(--text);
  border-radius:8px;
  padding:9px 14px;
}
button:hover{border-color:var(--blue)}
.primary{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}
main{max-width:1000px;margin:auto;padding:24px 16px}
h1,h2,h3{line-height:1.5}
.muted{color:var(--muted)}
.search{
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:9px;
  margin:15px 0;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:14px;
}
.card{
  border:1px solid var(--border);
  border-radius:10px;
  padding:18px;
  background:white;
}
.card h3{margin-top:0}
.card button{width:100%;margin-top:10px}
.badge{
  display:inline-block;
  background:var(--blue-light);
  color:var(--blue);
  padding:3px 10px;
  border-radius:5px;
  font-size:13px;
}
.lesson-text{font-size:17px}
.lesson-section{
  padding:16px 0;
  border-bottom:1px solid var(--border);
}
pre{
  direction:ltr;
  text-align:left;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  background:#f3f4f6;
  color:#202020;
  padding:15px;
  border-radius:8px;
  overflow-x:auto;
  font-size:14px;
}
.output{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  padding:12px;
  border-radius:8px;
}
.note{
  background:var(--blue-light);
  border-right:4px solid var(--blue);
  padding:12px;
  border-radius:5px;
}
.actions{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  padding:20px 0;
}
.actions button{flex:1;min-width:90px}
.hidden{display:none!important}
footer{
  border-top:1px solid var(--border);
  text-align:center;
  padding:20px;
  color:var(--muted);
}
body.dark{
  --bg:#15171a;
  --soft:#202328;
  --text:#f3f4f6;
  --muted:#a1a1aa;
  --border:#35383f;
  --blue-light:#1e293b;
}
body.dark .card,body.dark button{background:#202328;color:var(--text)}
body.dark .primary{background:var(--blue);color:white}
body.dark pre{background:#24272d;color:#f3f4f6}
body.dark .output{background:#14251b;color:#e5f7eb}
@media(max-width:500px){
  header{padding:12px}
  main{padding:18px 13px}
  .lesson-text{font-size:16px}
  .actions button{padding:9px 5px}
}
</style>
</head>

<body>
<header>
  <div class="logo">الطالب DZ</div>
  <div>
    <button id="homeButton">الرئيسية</button>
    <button id="themeButton">🌙</button>
  </div>
</header>

<main>
<section id="homePage">

  <p class="muted">تعلّم الإعلام الآلي خطوة بخطوة، من الأساسيات إلى المشاريع التطبيقية.</p>
  <input id="search" class="search" placeholder="ابحث عن مادة..." aria-label="ابحث عن مادة">
  <div id="subjects" class="grid"></div>
</section>

<section id="coursePage" class="hidden">
  <button id="backSubjects">← رجوع للمواد</button>
  <h1 id="courseTitle"></h1>

  <div id="lessonList" class="grid"></div>
</section>

<section id="lessonPage" class="hidden">
  <button id="backLessons">← رجوع للدروس</button>
  <div class="badge" id="lessonNumber"></div>
  <h1 id="lessonTitle"></h1>
  <div id="lessonContent" class="lesson-text"></div>
  <div class="actions">
    <button id="prevLesson">⬅️ رجوع</button>
    <button id="saveLesson" class="primary">💾 حفظ التقدم</button>
    <button id="nextLesson">تقدّم ➡️</button>
  </div>
  <p id="saveMessage" class="muted" aria-live="polite"></p>
</section>
</main>

<footer>
  الطالب DZ | Étudiant DZ<br>

</footer>

   theory:`Java لغة برمجة تُستخدم في بناء تطبيقات الحاسوب والخوادم وأنواع مختلفة من البرامج. تعتمد على كتابة تعليمات يفهمها المترجم ثم ينفذها الحاسوب عبر بيئة تشغيل Java.

قبل البرمجة، افهم الفرق بين الكود المصدري والبرنامج المنفّذ: الكود المصدري هو ما تكتبه، أما التنفيذ فهو تشغيل التعليمات للحصول على نتيجة.`,

int للأعداد الصحيحة، double للأعداد العشرية، char لحرف واحد، boolean للقيمتين true وfalse، وString للنصوص.

يجب تعريف المتغير قبل استعماله، واختيار اسم واضح يساعد على فهم البرنامج.`,

انتبه: عندما يكون العددان من نوع int فإن القسمة قد تعطي نتيجة صحيحة فقط دون الجزء العشري. استخدم double إذا احتجت نتيجة عشرية.`,

من المقارنات المهمة: == للمساواة، != للاختلاف، > أكبر من، < أصغر من، >= أكبر أو يساوي، و<= أصغر أو يساوي.

لا تخلط بين = التي تسند قيمة للمتغير و== التي تقارن قيمتين.`,

if (mark >= 10) {

في for توجد عادة ثلاث مراحل: التهيئة، الشرط، ثم تحديث المتغير بعد كل دورة.`,

تساعد الوراثة على إعادة استخدام الكود، لكن يجب استعمالها عندما توجد علاقة منطقية بين الصنفين.`,
   code:`class Animal {
    void sound() {

}

معالجة الاستثناء لا تعني تجاهل كل الأخطاء؛ يجب فهم سبب المشكلة واختيار معالجة مناسبة.`,

const homePage = document.getElementById("homePage");
const coursePage = document.getElementById("coursePage");
const lessonPage = document.getElementById("lessonPage");
const subjects = document.getElementById("subjects");
const lessonList = document.getElementById("lessonList");
const lessonContent = document.getElementById("lessonContent");

let currentCourse = null;
let currentIndex = 0;

function safeGet(key){
  try{return localStorage.getItem(key)}catch(e){return null}
}
function safeSet(key,value){
  try{localStorage.setItem(key,value);return true}catch(e){return false}
}
function showPage(page){
  homePage.classList.toggle("hidden",page!=="home");
  coursePage.classList.toggle("hidden",page!=="course");
  lessonPage.classList.toggle("hidden",page!=="lesson");
  window.scrollTo(0,0);
}
function renderSubjects(filter=""){
  subjects.innerHTML="";
  courses.filter(c=>(c.name+" "+c.desc).toLowerCase().includes(filter.toLowerCase()))
  .forEach(c=>{
    const card=document.createElement("article");
    card.className="card";
    const saved=safeGet("studentdz-"+c.id);
    card.innerHTML=`<span class="badge">${c.lessons.length} دروس</span>
      <h3>${c.name}</h3><p class="muted">${c.desc}</p>
      <p class="muted">${saved!==null?"لديك تقدم محفوظ":"ابدأ التعلّم"}</p>
      <button class="primary">دخول المادة</button>`;
    card.querySelector("button").addEventListener("click",()=>openCourse(c.id));
    subjects.appendChild(card);
  });
}
function openCourse(id){
  currentCourse=courses.find(c=>c.id===id);
  if(!currentCourse)return;
  document.getElementById("courseTitle").textContent=currentCourse.name;
  lessonList.innerHTML="";
  currentCourse.lessons.forEach((l,i)=>{
    const card=document.createElement("article");
    card.className="card";
    card.innerHTML=`<span class="badge">الدرس ${i+1}</span>
      <h3>${l.title}</h3><button class="primary">فتح الدرس</button>`;
    card.querySelector("button").addEventListener("click",()=>openLesson(i));
    lessonList.appendChild(card);
  });
  showPage("course");
}
function openLesson(index){
  currentIndex=Math.max(0,Math.min(index,currentCourse.lessons.length-1));
  const l=currentCourse.lessons[currentIndex];
  document.getElementById("lessonNumber").textContent=
    "الدرس "+(currentIndex+1)+" من "+currentCourse.lessons.length;
  document.getElementById("lessonTitle").textContent=l.title;

  const explain=l.explain.map((line,i)=>`<li>${escapeHTML(line)}</li>`).join("");
  lessonContent.innerHTML=`
    <section class="lesson-section">
      <h2>1. الشرح النظري</h2>
      <p>${escapeHTML(l.theory).replace(/\n/g,"<br>")}</p>
    </section>
    <section class="lesson-section">
      <h2>2. المثال التطبيقي</h2>
      <pre><code>${escapeHTML(l.code)}</code></pre>
      <h3>شرح المثال</h3>
      <ol>${explain}</ol>
    </section>
    <section class="lesson-section">
      <h2>3. النتيجة المتوقعة</h2>
      <div class="output">${escapeHTML(l.output).replace(/\n/g,"<br>")}</div>
    </section>
    <section class="lesson-section">
      <h2>4. تمرين تطبيقي</h2>
      <p>${escapeHTML(l.exercise)}</p>
      <details><summary>نصيحة للحل</summary>
        <p>راجع المثال السابق، حدّد المتغيرات أو الأوامر المطلوبة، ثم جرّب كتابة الحل بنفسك قبل فتح الحل.</p>
      </details>
    </section>
    <section class="lesson-section">
      <h2>5. أخطاء شائعة</h2>
      <ul>
        <li>الاستعجال في كتابة الكود دون فهم كل سطر.</li>
        <li>إهمال علامات الترقيم أو أسماء المتغيرات.</li>
        <li>عدم تجربة المثال وتغيير قيمه للتأكد من فهمه.</li>
      </ul>
    </section>`;

  document.getElementById("prevLesson").disabled=currentIndex===0;
  document.getElementById("nextLesson").disabled=currentIndex===currentCourse.lessons.length-1;
  document.getElementById("saveMessage").textContent="";
  showPage("lesson");
}
function escapeHTML(text){
  return String(text).replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}
document.getElementById("backSubjects").addEventListener("click",()=>showPage("home"));
document.getElementById("backLessons").addEventListener("click",()=>showPage("course"));
document.getElementById("homeButton").addEventListener("click",()=>showPage("home"));
document.getElementById("search").addEventListener("input",e=>renderSubjects(e.target.value));
document.getElementById("prevLesson").addEventListener("click",()=>{
  if(currentIndex>0)openLesson(currentIndex-1);
});
document.getElementById("nextLesson").addEventListener("click",()=>{
  if(currentIndex<currentCourse.lessons.length-1)openLesson(currentIndex+1);
});
document.getElementById("saveLesson").addEventListener("click",()=>{
  if(!currentCourse)return;
  const ok=safeSet("studentdz-"+currentCourse.id,String(currentIndex));
  document.getElementById("saveMessage").textContent=ok?
    "تم حفظ تقدمك على هذا الجهاز. تقدر تكمل من نفس الدرس لاحقاً.":
    "تعذر الحفظ في هذا المتصفح. جرّب فتح الموقع في متصفح عادي.";
});
document.getElementById("themeButton").addEventListener("click",()=>{
  document.body.classList.toggle("dark");
  safeSet("studentdz-theme",document.body.classList.contains("dark")?"dark":"light");
});
if(safeGet("studentdz-theme")==="dark")document.body.classList.add("dark");
renderSubjects();
</script>
</body>
</html>
