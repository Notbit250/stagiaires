<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<meta name="description" content="الطالب DZ: دروس الإعلام الآلي والبرمجة وقواعد البيانات للطلبة الجزائريين">
<title>الطالب DZ | Étudiant DZ</title>

<style>
:root {
  --bg:#0b1120;
  --panel:#121c2e;
  --card:#172338;
  --text:#edf3ff;
  --muted:#a6b4ca;
  --accent:#38bdf8;
  --border:#293950;
  --green:#34d399;
}
body.light {
  --bg:#f1f5f9;
  --panel:#ffffff;
  --card:#f8fafc;
  --text:#172033;
  --muted:#56657a;
  --accent:#0284c7;
  --border:#d7e0ec;
  --green:#059669;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Tahoma,sans-serif;line-height:1.8;
  transition:background .2s,color .2s
}
button,input{font:inherit}
button{cursor:pointer}
header{
  padding:18px 5%;background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap
}
.logo{font-size:22px;font-weight:bold;color:var(--accent)}
.logo small{display:block;font-size:12px;color:var(--muted);font-weight:normal}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--border);background:var(--card);
  color:var(--text);padding:9px 13px;border-radius:10px
}
.btn.primary{background:var(--accent);color:#07111e;border:0;font-weight:bold}
main{max-width:1100px;margin:auto;padding:20px}
.hero{
  padding:28px 22px;border:1px solid var(--border);border-radius:20px;
  background:linear-gradient(135deg,var(--panel),var(--card));
  margin-bottom:22px
}
.hero h1{font-size:clamp(25px,5vw,38px);margin:0 0 8px}
.hero p{color:var(--muted);margin:0 0 16px}
.search{
  width:100%;padding:13px;border-radius:12px;
  border:1px solid var(--border);background:var(--bg);color:var(--text)
}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:var(--card);padding:10px 14px;border-radius:10px;font-size:14px}
.section-title{margin:25px 0 12px;font-size:22px}
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.course{
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  padding:18px;display:flex;flex-direction:column;gap:8px
}
.course .icon{font-size:34px}
.course h3{margin:0;font-size:19px}
.course p{margin:0;color:var(--muted);font-size:14px;flex:1}
.course button{margin-top:8px}
.hidden{display:none!important}
#lessonView{margin-top:20px}
.lesson-head{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;flex-wrap:wrap;margin-bottom:14px
}
.lesson-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px}
.sidebar,.lesson-content{
  border:1px solid var(--border);border-radius:15px;
  background:var(--panel);padding:15px;min-width:0
}
.sidebar h3{margin-top:0}
.lesson-link{
  display:block;width:100%;text-align:right;margin:6px 0;
  padding:10px;border:1px solid transparent;border-radius:9px;
  background:var(--card);color:var(--text)
}
.lesson-link.active{border-color:var(--accent);color:var(--accent)}
.lesson-content h1{font-size:27px;line-height:1.4;margin-top:0}
.lesson-content h2{font-size:20px;border-bottom:1px solid var(--border);padding-bottom:7px;margin-top:26px}
.lesson-content p{color:var(--text)}
.note{
  padding:12px;border-right:4px solid var(--accent);
  background:var(--card);border-radius:8px;margin:14px 0
}
pre{
  background:#07101d;color:#d9f4ff;padding:15px;border-radius:12px;
  overflow-x:auto;direction:ltr;text-align:left;white-space:pre;
  font:14px/1.7 Consolas,monospace
}
.output{
  background:#09251e;color:#a7f3d0;padding:12px;border-radius:10px;
  direction:ltr;text-align:left;white-space:pre-wrap
}
.exercise,.quiz{background:var(--card);border:1px solid var(--border);padding:15px;border-radius:12px;margin-top:15px}
.quiz button{display:block;width:100%;text-align:right;margin:8px 0;padding:10px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--text)}
.feedback{margin-top:10px;font-weight:bold}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.lesson-nav button{flex:1}
.progress-wrap{height:8px;background:var(--border);border-radius:10px;overflow:hidden;margin:10px 0 18px}
.progress-bar{height:100%;width:0;background:var(--green);transition:width .2s}
footer{text-align:center;padding:30px 15px;color:var(--muted);border-top:1px solid var(--border);margin-top:35px}
@media(max-width:720px){
 .lesson-layout{grid-template-columns:1fr}
 .sidebar{order:2}
 .lesson-content{order:1}
 main{padding:13px}
 .hero{padding:21px 16px}
}
</style>
</head>

<body>
<header>
  <div class="logo">🎓 الطالب DZ <small>Étudiant DZ | تعلّم خطوة بخطوة</small></div>
  <div class="header-actions">
    <button class="btn" id="themeBtn">🌙 / ☀️</button>
    <button class="btn" id="homeBtn">الرئيسية</button>
  </div>
</header>

<main>
  <section id="homeView">
    <div class="hero">
      <h1>مستقبلك يبدأ من هنا 🚀</h1>
      <p>تعلّم البرمجة وقواعد البيانات والإعلام الآلي بالعربية، مع أمثلة وتمارين واختبارات.</p>
      <input id="search" class="search" placeholder="🔎 ابحث عن درس أو تخصص..." aria-label="ابحث عن درس أو تخصص">
      <div class="stats">
        <div class="stat">📚 <span id="courseCount">7</span> تخصصات</div>
        <div class="stat">📖 <span id="lessonCount">0</span> درس</div>
        <div class="stat">✅ تقدّمك: <span id="progressText">0%</span></div>
      </div>
      <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
    </div>
    <h2 class="section-title">📚 اختَر تخصصك</h2>
    <div id="courseGrid" class="courses"></div>
  </section>

  <section id="lessonView" class="hidden">
    <div class="lesson-head">
      <button class="btn" id="backBtn">→ الرجوع إلى التخصصات</button>
      <span id="courseLabel"></span>
    </div>
    <div class="lesson-layout">
      <aside class="sidebar">
        <h3>📑 فهرس الدروس</h3>
        <div id="lessonList"></div>
      </aside>
      <article class="lesson-content" id="lessonContent"></article>
    </div>
  </section>
</main>

<footer>
  <div>🎓 الطالب DZ | Étudiant DZ</div>
  <div>التعلّم اليوم هو نجاح الغد 💙</div>
  <p>هاني دوفة</p>
</footer>

 {title:"المتغيرات وأنواع البيانات",body:"المتغير مكان في الذاكرة نخزّن فيه قيمة. int للأعداد الصحيحة، double للأعداد العشرية، char لحرف، String للنصوص، وboolean للقيم true أو false.",code:'int age = 21;\ndouble price = 12.5;\nString name = "Hani";\nboolean student = true;\nSystem.out.println(name);\nSystem.out.println(age);',output:"Hani\n21",tip:"النصوص بين علامتي اقتباس مزدوجتين، ومعظم تعليمات Java تنتهي بفاصلة منقوطة.",q:"أي نوع يناسب العدد 12.5؟",opts:["int","double","boolean"],ans:1,exercise:"أنشئ متغيرًا باسم city من النوع String وخزّن فيه اسم مدينتك."},
 {title:"العمليات الحسابية",body:"تدعم Java العمليات + للجمع، - للطرح، * للضرب، / للقسمة، و% لباقي القسمة.",code:'int a = 10;\nint b = 3;\nSystem.out.println(a + b);\nSystem.out.println(a % b);',output:"13\n1",tip:"قسمة عددين صحيحين قد تعطي نتيجة صحيحة فقط؛ استعمل double عند الحاجة إلى الكسور.",q:"ما نتيجة 10 % 3؟",opts:["3","1","0"],ans:1,exercise:"أنشئ متغيرين واجمعهما ثم اطبع النتيجة."},
 {title:"الشروط if و else",body:"نستخدم if لاتخاذ قرار حسب شرط. إذا تحقق الشرط ينفذ البرنامج الكتلة الأولى، وإلا ينفذ else.",code:'int mark = 15;\nif (mark >= 10) {\n    System.out.println("Admis");\n} else {\n    System.out.println("Ajourné");\n}',output:"Admis",tip:"استعمل == للمقارنة بين قيمتين، وليس = التي تُستخدم للإسناد.",q:"متى ينفّذ البرنامج else؟",opts:["عندما يكون الشرط غير محقق","دائمًا","قبل if"],ans:0,exercise:"اكتب شرطًا يطبع Réussi إذا كانت العلامة 10 أو أكثر."},
 {title:"الحلقات for و while",body:"الحلقات تكرّر تنفيذ التعليمات. for مناسبة عندما تعرف عدد التكرارات غالبًا، وwhile تستمر ما دام الشرط صحيحًا.",code:'for (int i = 1; i <= 3; i++) {\n    System.out.println(i);\n}',output:"1\n2\n3",tip:"تأكد من تحديث متغير الحلقة حتى لا تدخل في حلقة لا نهائية.",q:"كم مرة تتكرر الحلقة في المثال؟",opts:["مرتين","3 مرات","4 مرات"],ans:1,exercise:"عدّل الحلقة لتطبع الأعداد من 1 إلى 5."},
 {title:"الدوال Methods",body:"الدالة تجمع تعليمات في جزء يمكن استدعاؤه عند الحاجة. نوع الإرجاع void يعني أنها لا تعيد قيمة.",code:'public static int add(int a, int b) {\n    return a + b;\n}\npublic static void main(String[] args) {\n    System.out.println(add(2, 3));\n}',output:"5",tip:"نوع القيمة بعد return يجب أن يتوافق مع نوع الدالة.",q:"ما فائدة الدوال؟",opts:["إعادة استعمال التعليمات","إيقاف الحاسوب","حذف المتغيرات"],ans:0,exercise:"أنشئ دالة تستقبل عددين وتعيد حاصل ضربهما."},
 {title:"مقدمة في البرمجة الكائنية",body:"البرمجة الكائنية OOP تنظّم البرنامج في أصناف Classes وكائنات Objects. الصنف يصف الخصائص والسلوك، والكائن نسخة منه.",code:'class Student {\n    String name;\n    Student(String n) {\n        name = n;\n    }\n}\nStudent s = new Student("Hani");\nSystem.out.println(s.name);',output:"Hani",tip:"هذا المثال يشرح الفكرة؛ ضع الصنف والدالة الرئيسية في ملف Java صحيح عند التجربة.",q:"ما هو Object؟",opts:["نسخة من صنف","نوع قاعدة بيانات","حلقة تكرار"],ans:0,exercise:"أنشئ صنفًا Car فيه خاصية brand ثم أنشئ منه كائنًا."}

 {title:"إنشاء جدول CREATE TABLE",body:"الأمر CREATE TABLE ينشئ جدولًا. نحدّد اسم كل عمود ونوع البيانات التي يمكن أن يخزنها.",code:"CREATE TABLE stagiaire (\n id INT PRIMARY KEY,\n nom VARCHAR(50),\n age INT\n);",output:"إنشاء جدول stagiaire بثلاثة أعمدة.",tip:"PRIMARY KEY يميّز كل سجل ويمنع تكرار قيمة المفتاح.",q:"ما وظيفة VARCHAR؟",opts:["تخزين نص بطول متغير","إجراء عملية جمع","حذف الجدول"],ans:0,exercise:"أنشئ جدول formation فيه id وnom."},
 {title:"إضافة البيانات INSERT",body:"نستعمل INSERT INTO لإضافة سجل جديد. من الأفضل تحديد أسماء الأعمدة لتوضيح ترتيب القيم.",code:"INSERT INTO stagiaire (id, nom, age)\nVALUES (1, 'Hani', 21);",output:"إضافة متربص اسمه Hani.",tip:"النصوص توضع بين اقتباسين مفردين في SQL غالبًا.",q:"ما الأمر المستخدم لإضافة سجل؟",opts:["INSERT INTO","SELECT","DROP"],ans:0,exercise:"أضف سجلًا آخر باسم Ahmed وعمر 20 مع id مختلف."},
 {title:"عرض البيانات SELECT",body:"SELECT تسترجع البيانات من جدول. النجمة * تعني اختيار جميع الأعمدة.",code:"SELECT * FROM stagiaire;\nSELECT nom FROM stagiaire;",output:"الأول يعرض كل الأعمدة، والثاني يعرض عمود nom فقط.",tip:"يمكن تحديد الأعمدة المطلوبة بدل استعمال * عندما لا تحتاج جميع البيانات.",q:"ما وظيفة SELECT؟",opts:["عرض البيانات","إنشاء مستخدم فقط","حذف قاعدة البيانات"],ans:0,exercise:"اكتب استعلامًا يعرض أسماء المتربصين فقط."},

 {title:"الروابط والصور",body:"العنصر a لإنشاء رابط، وimg لإظهار صورة. الخاصية href للرابط وsrc لمسار الصورة.",code:'<a href="https://example.com">افتح الموقع</a>\n<img src="photo.jpg" alt="صورة توضيحية">',output:"رابط وصورة إذا كان الملف photo.jpg موجودًا.",tip:"استعمل alt لوصف الصورة، وتأكد من صحة مسار الملف.",q:"ما الخاصية التي تحدد مصدر الصورة؟",opts:["src","href","class"],ans:0,exercise:"أضف رابطًا إلى موقع تعليمي وصورة من ملفاتك."},

 {title:"مقدمة في CSS",body:"CSS مسؤولة عن شكل الصفحة: الألوان والخطوط والمسافات والتخطيط. يمكن وضعها داخل style أو ملف منفصل.",code:"<style>\nbody { background: #101827; color: white; }\nh1 { color: #38bdf8; }\n</style>\n<h1>مرحبا بالعالم</h1>",output:"خلفية داكنة ونص أبيض وعنوان أزرق.",tip:"الألوان تقبل أسماء أو قيم HEX مثل #38bdf8.",q:"ما دور CSS؟",opts:["تنسيق المظهر","تخزين قواعد البيانات","ترجمة Java"],ans:0,exercise:"غيّر لون العنوان وحجم الخط وأضف مسافة داخلية لعنصر."},
 {title:"Flexbox والتصميم المتجاوب",body:"Flexbox يساعد على ترتيب العناصر. التصميم المتجاوب يجعل الموقع مناسبًا للشاشات المختلفة باستخدام وحدات مرنة ووسائط CSS.",code:".cards {\n display: flex;\n gap: 12px;\n flex-wrap: wrap;\n}\n@media (max-width: 600px) {\n .cards { flex-direction: column; }\n}",output:"العناصر تصطف في صفوف على الشاشات الواسعة وتتحول إلى عمود على الشاشات الصغيرة.",tip:"اختبر الصفحة على الهاتف، وتجنّب عرضًا ثابتًا كبيرًا يسبب التمرير الأفقي.",q:"ما فائدة flex-wrap؟",opts:["السماح للعناصر بالانتقال لسطر آخر","حذف العناصر","تغيير لغة الصفحة"],ans:0,exercise:"صمّم ثلاث بطاقات تتجاوب مع شاشة الهاتف."}
 ]},
{

 lessons:[
 {title:"ما هي UML؟",body:"UML لغة نمذجة موحّدة لتمثيل الأنظمة قبل أو أثناء تطويرها. تساعد على توضيح المتطلبات والبنية والتفاعلات.",code:"نظام تسجيل المتربصين\nالمستخدمون: مسؤول التسجيل، المتربص\nالوظائف: التسجيل، البحث، تعديل المعلومات",output:"وصف أولي للنظام قبل رسم المخططات.",tip:"UML ليست لغة برمجة؛ هي مجموعة من المخططات لتمثيل النظام.",q:"ما الهدف الأساسي من UML؟",opts:["نمذجة النظام","كتابة SQL فقط","تغيير نظام التشغيل"],ans:0,exercise:"اكتب ثلاثة متطلبات لنظام مكتبة."},
 {title:"مخطط حالات الاستخدام",body:"Use Case Diagram يوضح الممثلين Actors والوظائف التي يتعاملون معها. الممثل قد يكون شخصًا أو نظامًا خارجيًا.",code:"الممثل: مسؤول التسجيل\nحالات الاستخدام:\n- إضافة متربص\n- البحث عن متربص\n- تعديل بيانات متربص\n- طباعة قائمة",output:"يمكن رسم المسؤول خارج مستطيل النظام، والحالات داخل المستطيل وربطها بخطوط.",tip:"اسم حالة الاستخدام عادة فعل واضح مثل إضافة أو البحث أو طباعة.",q:"ماذا يمثل Actor؟",opts:["جهة تتفاعل مع النظام","جدول SQL","نوع متغير"],ans:0,exercise:"حدّد الممثلين وحالات الاستخدام لنظام مكتبة."},
 {title:"مخطط الأصناف Class Diagram",body:"Class Diagram يصف الأصناف وخصائصها وعملياتها والعلاقات بينها.",code:"Classe: Stagiaire\n------------------\n- id : int\n- nom : String\n------------------\n+ afficher() : void",output:"صنف اسمه Stagiaire فيه خاصيتان وعملية afficher.",tip:"الرمز - يشير عادة إلى private والرمز + إلى public.",q:"أين نكتب الخصائص؟",opts:["في قسم الخصائص داخل الصنف","خارج كل المخططات دائمًا","في عنوان الصفحة"],ans:0,exercise:"صمّم صنف Livre فيه id وtitre وauteur."},
 {title:"مخطط التسلسل Sequence",body:"Sequence Diagram يوضح الرسائل بين المشاركين بترتيب زمني، من الأعلى إلى الأسفل غالبًا.",code:"المتربص → واجهة التسجيل: إدخال البيانات\nواجهة التسجيل → النظام: إرسال الطلب\nالنظام → قاعدة البيانات: حفظ البيانات\nقاعدة البيانات → النظام: تأكيد\nالنظام → الواجهة: رسالة نجاح",output:"تسلسل تفاعل يوضح كيف تتم عملية التسجيل.",tip:"ركّز على ترتيب الرسائل ومن يرسلها ومن يستقبلها.",q:"ماذا يوضح Sequence Diagram؟",opts:["ترتيب التفاعلات زمنيًا","ألوان الواجهة","حجم قاعدة البيانات"],ans:0,exercise:"اكتب تسلسلًا من أربع خطوات لتسجيل دخول المستخدم."},
 {title:"العلاقات والتعددية",body:"العلاقات تربط الأصناف. التعددية مثل 1 و0..1 و0..* و1..* تصف عدد العناصر المرتبطة.",code:"متربص 1 -------- 0..* تسجيل\n\nالمعنى:\nالمتربص قد تكون له عدة تسجيلات.\nكل تسجيل مرتبط بمتربص واحد في هذا النموذج.",output:"علاقة واحد إلى متعدد.",tip:"التعددية تعتمد على قواعد العمل، فلا تختَرها دون فهم النظام.",q:"ماذا تعني 0..*؟",opts:["صفر أو أكثر","عنصر واحد بالضبط","عنصران فقط"],ans:0,exercise:"مثّل العلاقة بين قسم وعدة متربصين."}

{
 id:"merise",name:"Merise",icon:"🧩",desc:"تحليل البيانات وبناء النماذج قبل إنشاء القاعدة.",
 lessons:[
 {title:"مقدمة في Merise",body:"Merise منهجية لتحليل وتصميم نظم المعلومات. تفصل بين البيانات والمعالجات وتساعد على الانتقال من دراسة المؤسسة إلى التنفيذ.",code:"دراسة المؤسسة\n↓\nتحديد الكيانات والعلاقات\n↓\nإنشاء نموذج البيانات\n↓\nتحويله إلى جداول",output:"مراحل عامة لبناء قاعدة بيانات.",tip:"ابدأ بفهم العمل والمعلومات المطلوبة قبل إنشاء الجداول.",q:"لماذا نحلل المؤسسة أولًا؟",opts:["لفهم احتياجاتها","لزيادة عدد الجداول فقط","لتغيير الألوان"],ans:0,exercise:"اختر مؤسسة واكتب خمس معلومات تحتاج إلى تخزينها."},
 {title:"قاموس البيانات",body:"قاموس البيانات جدول يصف كل معلومة: اسمها، معناها، نوعها، طولها، مصدرها وقواعدها.",code:"Nom logique : Nom_Stagiaire\nSignification : اسم المتربص\nType : Texte\nTaille : 50\nObligatoire : Oui",output:"تعريف واضح لحقل اسم المتربص.",tip:"استعمل أسماء واضحة وموحّدة، وتجنّب تكرار المعنى نفسه بأسماء مختلفة.",q:"ما فائدة قاموس البيانات؟",opts:["توحيد فهم البيانات","تشغيل الفيديو","حذف العلاقات"],ans:0,exercise:"أنشئ قاموسًا لحقول id وnom وdate_naissance."},
 {title:"الكيانات والخصائص",body:"الكيان يمثل شيئًا نحتاج إلى تخزين معلومات عنه مثل متربص أو تكوين أو أستاذ. الخصائص تصف هذا الكيان.",code:"ENTITE : STAGIAIRE\n- id_stagiaire\n- nom\n- prenom\n- date_naissance",output:"كيان STAGIAIRE بأربع خصائص.",tip:"اختر معرّفًا فريدًا لكل كيان، مثل id_stagiaire.",q:"ما مثال الكيان؟",opts:["متربص","عملية جمع","لون النص"],ans:0,exercise:"حدّد خصائص كيان Formation."},
 {title:"العلاقات وقواعد العمل",body:"العلاقة تصف ارتباط الكيانات. قواعد العمل تحدد كيف يحدث هذا الارتباط وعدد العناصر المسموح بها.",code:"STAGIAIRE — s'inscrit à — FORMATION\n\nقاعدة افتراضية:\nالمتربص يمكنه التسجيل في عدة تكوينات.\nالتكوين يمكن أن يستقبل عدة متربصين.",output:"علاقة متعدد إلى متعدد حسب قاعدة العمل المذكورة.",tip:"قد تحتاج العلاقة متعددة إلى متعدد إلى كيان وسيط عند تحويلها إلى جداول.",q:"ما الذي يحدد نوع العلاقة؟",opts:["قواعد العمل","لون الجدول","اسم الملف"],ans:0,exercise:"اكتب قاعدة عمل تربط الأستاذ بالقسم."},
 {title:"من MCD إلى MLD",body:"MCD يصف الكيانات والعلاقات بصورة مفاهيمية. MLD يحوّل النموذج إلى بنية منطقية، مثل الجداول والمفاتيح الأساسية والأجنبية.",code:"STAGIAIRE(\n id_stagiaire PK,\n nom\n)\n\nINSCRIPTION(\n id_stagiaire PK, FK,\n id_formation PK, FK,\n date_inscription\n)",output:"جدول وسيط INSCRIPTION يربط المتربص بالتكوين.",tip:"في علاقة متعدد إلى متعدد، يتكون الجدول الوسيط غالبًا من مفاتيح الكيانين.",q:"ما دور FK؟",opts:["ربط جدول بجدول","تلوين النص","ترتيب الصور"],ans:0,exercise:"حوّل علاقة طالب ومادة من متعدد إلى متعدد إلى جداول."}
 ]},

 {title:"التعرّف على Excel",body:"Excel برنامج جداول إلكترونية. الملف يسمى مصنفًا Workbook، ويحتوي أوراق عمل. الخلية هي تقاطع عمود وصف.",code:"A1 = Nom\nB1 = Note\nA2 = Hani\nB2 = 15",output:"جدول بسيط فيه أسماء وعلامات.",tip:"مرجع الخلية يتكون من حرف العمود ورقم الصف، مثل B2.",q:"ما اسم الخلية في العمود C والصف 4؟",opts:["C4","4C","CC"],ans:0,exercise:"أنشئ جدولًا فيه الاسم والعلامة والنتيجة."},
 {title:"الجمع SUM",body:"الدالة SUM تجمع مجموعة من القيم. في الإعدادات الشائعة، النقطتان تعنيان نطاقًا متصلًا من الخلايا.",code:"=SUM(B2:B6)",output:"مجموع القيم من B2 إلى B6.",tip:"قد تختلف الفواصل بين معاملات الدوال حسب لغة وإعدادات Excel.",q:"ما وظيفة SUM؟",opts:["الجمع","حساب النصوص فقط","حذف الورقة"],ans:0,exercise:"اجمع القيم الموجودة في C2 إلى C10."},
 {title:"المعدل AVERAGE",body:"AVERAGE تحسب المتوسط الحسابي للقيم الرقمية في نطاق محدد.",code:"=AVERAGE(B2:B6)",output:"معدل القيم الرقمية بين B2 وB6.",tip:"الخلايا الفارغة والنصوص داخل النطاق لا تُعامل عادة كأرقام في المتوسط.",q:"ما وظيفة AVERAGE؟",opts:["حساب المتوسط","إيجاد اللون","إنشاء جدول جديد"],ans:0,exercise:"احسب معدل علامات خمسة متربصين."},
 {title:"الشرط IF: ناجح أو راسب",body:"IF تختبر شرطًا وتعيد نتيجة إذا كان صحيحًا وأخرى إذا كان خاطئًا. مثال: النجاح عند الحصول على 10 أو أكثر.",code:'=IF(B2>=10,"ناجح","راسب")',output:"إذا كانت B2 تساوي 15 فالنتيجة ناجح؛ وإذا كانت 8 فالنتيجة راسب.",tip:"قد تحتاج إلى الفاصلة المنقوطة بدل الفاصلة حسب إعدادات جهازك.",q:"ماذا تعني B2>=10؟",opts:["القيمة أكبر أو تساوي 10","القيمة تساوي 2 فقط","الخانة فارغة حتمًا"],ans:0,exercise:"اكتب صيغة تعرض ممتاز إذا كانت العلامة 16 أو أكثر، وعادي فيما عدا ذلك."},
 {title:"العد COUNT و COUNTA",body:"COUNT تحسب الخلايا التي تحتوي أرقامًا، أما COUNTA فتحسب الخلايا غير الفارغة عمومًا.",code:"=COUNT(B2:B20)\n=COUNTA(A2:A20)",output:"الأولى تعدّ الخلايا الرقمية في B، والثانية تعدّ الخلايا غير الفارغة في A.",tip:"اختَر الدالة حسب ما تريد عده: أرقام فقط أم خلايا غير فارغة.",q:"أي دالة تعد الخلايا غير الفارغة؟",opts:["COUNTA","COUNT فقط","SUM"],ans:0,exercise:"احسب عدد العلامات الرقمية في عمود B."},
 {title:"الفرز والتصفية",body:"الفرز يرتب البيانات تصاعديًا أو تنازليًا. التصفية تعرض السجلات التي تحقق شروطًا محددة.",code:"1. حدّد الجدول مع العناوين.\n2. افتح Data / Données.\n3. اختر Sort أو Filter.\n4. حدّد عمود الفرز أو شرط التصفية.",output:"يمكن ترتيب العلامات من الأعلى للأدنى أو عرض الناجحين فقط.",tip:"تأكد من تحديد الجدول كاملًا حتى لا تنفصل العلامات عن أصحابها.",q:"ما فائدة Filter؟",opts:["عرض السجلات المطابقة لشرط","جمع الأرقام تلقائيًا دائمًا","حذف المصنف"],ans:0,exercise:"رتّب جدول المتربصين حسب العلامة تنازليًا."}
 ]},

 {title:"الإنترنت والويب",body:"الإنترنت شبكة عالمية تربط شبكات وأجهزة عديدة. الويب خدمة تعمل عبر الإنترنت وتتيح الوصول إلى صفحات مترابطة باستخدام المتصفحات.",code:"Browser → Internet → Web server\nمثال: فتح صفحة تعليمية عبر المتصفح.",output:"المتصفح يطلب محتوى من خادم ويب ثم يعرض الصفحة.",tip:"الإنترنت والويب ليسا المصطلح نفسه؛ الويب إحدى الخدمات التي تستخدم الإنترنت.",q:"هل الويب هو الإنترنت كله؟",opts:["لا، الويب خدمة من خدمات الإنترنت","نعم، هما متطابقان تمامًا","الويب برنامج رسم فقط"],ans:0,exercise:"اكتب الفرق بين الإنترنت والويب في سطرين."},
 {title:"الشبكات وعناوين IP",body:"الشبكة تربط أجهزة لتبادل البيانات والموارد. عنوان IP يساعد على تحديد واجهة جهاز على شبكة وفق نظام العنونة المستخدم.",code:"مثال IPv4:\n192.168.1.10\n\nأمر Windows لعرض إعدادات الشبكة:\nipconfig",output:"يعرض ipconfig معلومات اتصال الشبكة في Windows.",tip:"العنوان 192.168.x.x شائع في الشبكات المحلية، لكنه ليس عنوانًا عامًا بالضرورة.",q:"ما فائدة الشبكة؟",opts:["تبادل البيانات والموارد","زيادة حجم الشاشة","تغيير نوع المعالج"],ans:0,exercise:"اذكر فائدتين للشبكة في مؤسسة تكوين."},
 {title:"الحماية والنسخ الاحتياطي",body:"الأمن المعلوماتي يحمي البيانات والأجهزة. النسخ الاحتياطي ينشئ نسخة إضافية يمكن استخدامها عند فقدان الملفات.",code:"قاعدة عملية:\n- استعمل كلمة مرور قوية وفريدة.\n- حدّث النظام والبرامج.\n- احتفظ بنسخة احتياطية.\n- لا تفتح مرفقات مشبوهة.",output:"عادات أساسية لتقليل المخاطر.",tip:"احتفظ بنسخة احتياطية على وسيط منفصل أو خدمة موثوقة، واختبر إمكانية استرجاعها.",q:"ما فائدة النسخ الاحتياطي؟",opts:["استرجاع البيانات عند فقدانها","زيادة سرعة الإنترنت دائمًا","إلغاء الحاجة إلى كلمات المرور"],ans:0,exercise:"ضع خطة بسيطة لنسخ ملفات الدراسة المهمة احتياطيًا."}

let completed = loadCompleted();

function loadCompleted(){
  try { return JSON.parse(localStorage.getItem("talibDZ_completed") || "[]"); }
  catch(e){ return []; }
}
function saveCompleted(){
  try { localStorage.setItem("talibDZ_completed", JSON.stringify(completed)); }
  catch(e){}
}
function keyFor(c,i){ return c.id + ":" + i; }
function totalLessons(){
  return courses.reduce((n,c)=>n+c.lessons.length,0);
}
function updateProgress(){
  const total = totalLessons();
  const percent = total ? Math.round(completed.length / total * 100) : 0;
  $("progressText").textContent = percent + "%";
  $("progressBar").style.width = percent + "%";
  $("lessonCount").textContent = total;
}
function renderCourses(filter=""){
  const f = filter.trim().toLowerCase();
  $("courseGrid").innerHTML = "";
  courses.forEach(c=>{
    const matchingLessons = c.lessons.filter(l =>
      (l.title + " " + l.body + " " + c.name).toLowerCase().includes(f)
    );
    if(f && !matchingLessons.length) return;
    const card = document.createElement("div");
    card.className = "course";
    card.innerHTML = `
      <div class="icon">${c.icon}</div>
      <h3>${c.name}</h3>
      <p>${c.desc}</p>
      <p>📖 ${c.lessons.length} دروس</p>
      <button class="btn primary">ابدأ التعلّم ←</button>`;
    card.querySelector("button").addEventListener("click",()=>openCourse(c, f));
    $("courseGrid").appendChild(card);
  });
  if(!$("courseGrid").children.length){
    $("courseGrid").innerHTML="<p>لم نجد دروسًا مطابقة لبحثك.</p>";
  }
}
function openCourse(c, filter=""){
  activeCourse = c;
  const matching = c.lessons.map((l,i)=>({l,i})).filter(x=>
    !filter || (x.l.title+" "+x.l.body+" "+c.name).toLowerCase().includes(filter.toLowerCase())
  );
  activeIndex = matching.length ? matching[0].i : 0;
  $("homeView").classList.add("hidden");
  $("lessonView").classList.remove("hidden");
  $("courseLabel").textContent = c.icon + " " + c.name;
  $("lessonList").innerHTML = "";
  c.lessons.forEach((l,i)=>{
    const b = document.createElement("button");
    b.className = "lesson-link";
    b.textContent = (completed.includes(keyFor(c,i)) ? "✅ " : "📘 ") + (i+1)+". "+l.title;
    b.addEventListener("click",()=>showLesson(i));
    $("lessonList").appendChild(b);
  });
  showLesson(activeIndex);
  window.scrollTo({top:0,behavior:"smooth"});
}
function showLesson(i){
  if(!activeCourse) return;
  activeIndex = Math.max(0,Math.min(i,activeCourse.lessons.length-1));
  const l = activeCourse.lessons[activeIndex];
  document.querySelectorAll(".lesson-link").forEach((b,j)=>{
    b.classList.toggle("active",j===activeIndex);
    b.textContent = (completed.includes(keyFor(activeCourse,j)) ? "✅ " : "📘 ") + (j+1)+". "+activeCourse.lessons[j].title;
  });
  const done = completed.includes(keyFor(activeCourse,activeIndex));
  $("lessonContent").innerHTML = `
    <div style="color:var(--muted)">الدرس ${activeIndex+1} من ${activeCourse.lessons.length}</div>
    <h1>${l.title}</h1>
    <div class="note">🎯 <strong>هدف الدرس:</strong> ${l.body}</div>
    <h2>📖 الشرح</h2>
    <p>${l.body}</p>
    <h2>💻 مثال تطبيقي</h2>
    <pre><code></code></pre>
    <h2>📌 النتيجة أو التفسير</h2>
    <div class="output"></div>
    <div class="note">💡 <strong>نصيحة:</strong> ${l.tip}</div>
    <div class="exercise">
      <h2>✍️ تمرين تطبيقي</h2>
      <p>${l.exercise}</p>
      <details><summary>إظهار توجيه للمساعدة</summary><p>جرّب بنفسك أولًا، ثم قارن النتيجة مع المثال في الدرس وعدّل الحل حسب المطلوب.</p></details>
    </div>
    <div class="quiz">
      <h2>🧠 اختبر فهمك</h2>
      <p>${l.q}</p>
      <div id="quizOptions"></div>
      <div id="quizFeedback" class="feedback" aria-live="polite"></div>
    </div>
    <button id="completeBtn" class="btn ${done?"":"primary"}" style="margin-top:18px">${done?"✅ أكملت هذا الدرس":"✔ علّم الدرس كمكتمل"}</button>
    <div class="lesson-nav">
      <button id="prevBtn" class="btn" ${activeIndex===0?"disabled":""}>→ الدرس السابق</button>
      <button id="nextBtn" class="btn primary" ${activeIndex===activeCourse.lessons.length-1?"disabled":""}>الدرس التالي ←</button>
    </div>`;
  $("lessonContent").querySelector("pre code").textContent = l.code;
  $("lessonContent").querySelector(".output").textContent = l.output;
  const options = $("quizOptions");
  l.opts.forEach((opt,j)=>{
    const b=document.createElement("button");
    b.textContent=String.fromCharCode(65+j)+". "+opt;
    b.addEventListener("click",()=>{
      $("quizFeedback").textContent = j===l.ans ? "✅ إجابة صحيحة، أحسنت!" : "❌ ليست الإجابة الصحيحة، جرّب مرة أخرى.";
      $("quizFeedback").style.color = j===l.ans ? "var(--green)" : "#fb7185";
    });
    options.appendChild(b);
  });
  $("completeBtn").addEventListener("click",()=>{
    const k=keyFor(activeCourse,activeIndex);
    if(!completed.includes(k)) completed.push(k);
    saveCompleted();
    updateProgress();
    showLesson(activeIndex);
  });
  $("prevBtn").addEventListener("click",()=>showLesson(activeIndex-1));
  $("nextBtn").addEventListener("click",()=>showLesson(activeIndex+1));
}
function goHome(){
  $("lessonView").classList.add("hidden");
  $("homeView").classList.remove("hidden");
  activeCourse=null;
  renderCourses($("search").value);
  window.scrollTo({top:0,behavior:"smooth"});
}
$("search").addEventListener("input",e=>renderCourses(e.target.value));
$("homeBtn").addEventListener("click",goHome);
$("backBtn").addEventListener("click",goHome);
$("themeBtn").addEventListener("click",()=>document.body.classList.toggle("light"));

let touchStartX=0, touchStartY=0;
$("lessonView").addEventListener("touchstart",e=>{
  if(e.touches.length===1){
    touchStartX=e.touches[0].clientX;
    touchStartY=e.touches[0].clientY;
  }
},{passive:true});
$("lessonView").addEventListener("touchend",e=>{
  if(!activeCourse || !e.changedTouches.length) return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)>80 && Math.abs(dx)>Math.abs(dy)*1.3){
    if(dx<0 && activeIndex<activeCourse.lessons.length-1) showLesson(activeIndex+1);
    if(dx>0 && activeIndex>0) showLesson(activeIndex-1);
  }
},{passive:true});

document.addEventListener("keydown",e=>{
  if($("lessonView").classList.contains("hidden")) return;
  if(e.key==="ArrowLeft" && activeCourse) showLesson(activeIndex+1);
  if(e.key==="ArrowRight" && activeCourse) showLesson(activeIndex-1);
});

updateProgress();
renderCourses();
</script>
</body>
</html>
